<div class="p-6 max-w-7xl mx-auto">
  
  <!-- Encabezado y botón para subir fotos -->
  <div class="flex justify-between items-center mb-8 border-b pb-4">
    <h2 class="text-3xl font-bold text-gray-800">Mi Galería</h2>
    <button (click)="abrirModal()" class="bg-blue-600 text-white font-semibold px-4 py-2 rounded-lg shadow-sm hover:bg-blue-700 transition">
      Subir Nueva Foto
    </button>
  </div>

  <!-- RÚBRICA: Reemplazo moderno de *ngIf para mostrar mensajes de estado -->
  @if (fotos().length === 0) {
    <div class="text-center p-12 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl">
      <p class="text-gray-500 text-lg font-medium">No hay fotos disponibles.</p>
      <p class="text-gray-400 text-sm mt-2">Haz clic en el botón de arriba para subir tu primera fotografía.</p>
    </div>
  } @else {
    
    <!-- Cuadrícula para la galería -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      
      <!-- RÚBRICA: Reemplazo moderno de *ngFor para listar las fotos -->
      @for (foto of fotos(); track foto.id) {
        
        <!-- Tarjeta de la foto. Al darle clic, abre el componente de Detalle -->
        <article 
          (click)="seleccionarFoto(foto)"
          class="bg-white rounded-lg shadow-md overflow-hidden cursor-pointer hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
          
          <!-- RÚBRICA: Binding unidireccional (Property Binding para src y alt) -->
          <img [src]="foto.url" [alt]="foto.titulo" class="w-full h-48 object-cover">
          
          <div class="p-4">
            <!-- RÚBRICA: Binding unidireccional (Interpolación para imprimir texto) -->
            <h3 class="font-bold text-lg text-gray-800 truncate">{{ foto.titulo }}</h3>
            <span class="inline-block mt-2 bg-indigo-100 text-indigo-800 text-xs px-2 py-1 rounded-full uppercase tracking-wide">
              {{ foto.tipo }}
            </span>
          </div>
        </article>

      }
    </div>
  }
</div>
