<!-- El modal solo existe si el Signal 'abierto()' es true -->
@if (abierto()) {
  <div class="fixed inset-0 bg-black bg-opacity-60 flex justify-center items-center z-50 p-4">
    
    <!-- Caja blanca del modal -->
    <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl animate-fade-in-up">
      <h3 class="text-2xl font-bold mb-5 text-gray-800">Subir Nueva Foto</h3>

      <div class="flex flex-col gap-4">
        <!-- RÚBRICA: Binding bidireccional con ngModel -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Título</label>
          <input type="text" [(ngModel)]="nuevaFoto.titulo" 
                 class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">URL de la Imagen</label>
          <input type="text" [(ngModel)]="nuevaFoto.url" placeholder="https://..." 
                 class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Categoría</label>
          <select [(ngModel)]="nuevaFoto.tipo" 
                  class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="retrato">Retrato</option>
            <option value="paisaje">Paisaje</option>
            <option value="macro">Macro</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Descripción</label>
          <textarea [(ngModel)]="nuevaFoto.descripcion" rows="3" 
                    class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-gray-100">
        <button (click)="cerrar()" 
                class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition">
          Cancelar
        </button>
        <button (click)="guardar()" 
                class="px-4 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg font-semibold shadow transition">
          Guardar Foto
        </button>
      </div>
    </div>
  </div>
}
